# ==============================================================================
# FEDERaiDE Universal Lima Configuration
# ==============================================================================
cpus: 2
memory: "3GiB"
disk: "10GiB"

rosetta:
  enabled: true
  binfmt: true

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! command -v docker >/dev/null 2>&1; then
        curl -fsSL https://get.docker.com | sh
      fi
      usermod -aG docker "${LIMA_CIDATA_USER}"
      chmod 666 /var/run/docker.sock || true

portForwards:
  - guestPort: 6080
    hostPort: 6080
  - guestPort: 6081
    hostPort: 6081

mounts:
  - location: "~/.federate"
    writable: true
  - location: "~/FederateWorkspace"
    writable: true
  - location: "~/Documents/FederateWorkspace"
    writable: true